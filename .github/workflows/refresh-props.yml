name: Refresh props page

# Sunday, Monday and Thursday mornings (NFL game days). Cron runs in UTC:
# 13:00 UTC = 8:00 AM CDT / 7:00 AM CST. GitHub can start scheduled runs a few
# minutes late. Edit the hour below to move it.
on:
  schedule:
    - cron: "0 13 * * 0,1,4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Odds API key
        id: key
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY secret is not set - skipping. Add it with: gh secret set ODDS_API_KEY"
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.have_key == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.key.outputs.have_key == 'true'
        run: pip install -r requirements.txt

      # Only games starting in the next 24 hours: keeps each run to roughly one
      # slate's worth of API credits.
      - name: Pull lines and simulate
        if: steps.key.outputs.have_key == 'true'
        run: python export_props.py --days 1

      - name: Build page
        if: steps.key.outputs.have_key == 'true'
        run: |
          python web/build_props_page.py
          mkdir site
          cp web/props.html site/index.html   # the page only - never the raw snapshot JSON

      - uses: actions/configure-pages@v5
        if: steps.key.outputs.have_key == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.have_key == 'true'
        with:
          path: site
      - name: Publish
        id: deploy
        if: steps.key.outputs.have_key == 'true'
        uses: actions/deploy-pages@v4
