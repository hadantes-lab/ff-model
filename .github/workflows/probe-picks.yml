name: Probe picks sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Free picks and podcasts from a GitHub runner (nothing is committed)
        run: |
          python free_picks.py fetch
          python podcast_picks.py fetch
