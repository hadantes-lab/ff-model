name: Republish site

# Puts a finished site back on GitHub Pages WITHOUT re-fetching anything (zero Odds API credits). Use it when a refresh built and
# uploaded the site but the publish step failed: pass that run's id (gh run list --workflow refresh-site.yml) and it re-deploys
# the page that run built. The run's tracking-log rows are not recovered by this (they were never committed); only the page is.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the refresh whose built site (github-pages artifact) should be published"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: built
      - name: Unpack the site
        run: |
          mkdir site
          tar -xf built/artifact.tar -C site
          ls site | head
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
