name: Refresh site

# Monday, Thursday and Saturday mornings. Cron runs in UTC.
#   Saturday  pulls the player props for every Sunday game (and Sunday night) and publishes the week's page;
#   Monday    publishes Monday night's game alone (props, lines, defense vs position) plus the weekly report on the weekend;
#   Thursday  publishes Thursday night's game alone, plus the report on the full week including Monday night.
# Three runs a week instead of four is part of staying inside the Odds API's 500 free credits a month (see props_budget in export_props.py).
# Scheduled to start at 11:17 UTC = 6:17 AM CDT / 5:17 AM CST, NOT at 8 AM sharp: GitHub queues scheduled runs
# late under load, worst at the top of the hour (it was 4-8 hours late on three occasions), so the schedule asks early
# and at an off-peak minute to have the page ready by 8. Run it by hand any time from the Actions tab.
# A scheduled run that starts within 12 hours of a successful run (e.g. you ran it by hand, and the cron fires late) skips itself, see `gate`.
# Scheduled runs are at least two days apart, so the window never swallows the next real one.
on:
  schedule:
    - cron: "17 11 * * 1,4,6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Stops a late scheduled run from re-spending Odds API credits on a slate that was just published. Only scheduled
  # runs can be skipped; a manual run always goes ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - name: Skip a scheduled run if a refresh succeeded in the last 12 hours
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-site.yml --status success --limit 1 --json createdAt -q '.[0].createdAt' || true)
            if [ -n "$last" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              echo "Last successful refresh: $last (${age}s ago)"
              if [ "$age" -lt 43200 ]; then skip=true; fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}     # optional: without it no social posts are fetched and nothing is spent
      X_HANDLES: ${{ vars.X_HANDLES }}                   # optional: comma-separated handles, in addition to social_sources.json
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}    # optional: a free YouTube Data API key; without it no channel is read
      YOUTUBE_CHANNELS: ${{ vars.YOUTUBE_CHANNELS }}     # optional: comma-separated handles, in addition to social_sources.json
    steps:
      - uses: actions/checkout@v4

      - name: Check for Odds API key
        id: key
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY secret is not set - skipping the props page. Add it with: gh secret set ODDS_API_KEY"
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Draft board: needs no key (nflverse stats + consensus rankings).
      - name: Rebuild draft board
        run: |
          python export_snapshot.py > web/snapshot.json
          python web/build_page.py

      # Grade props logged on earlier runs against now-final results, refit the market-blend
      # trust weight per market from those real tracked outcomes (live_calibration.json --
      # conservative: only markets with 50+ graded picks and a clear improvement get an
      # override, so most weeks this changes nothing), then build the track record -- all
      # before pulling this week's lines, so export_props.py picks up today's refined weights.
      - name: Grade previous props, refine calibration, build the track record
        if: steps.key.outputs.have_key == 'true'
        run: |
          python props_tracker.py grade
          python props_tracker.py refine
          python props_tracker.py report --json

      # Free picks from the web (ESPN's FPI, Covers' computer, Pickswise's handicappers): public pages, no key, no cost. Logged to the same
      # pick log as X picks so each source is graded on its own record, and saved as tracking/free_picks_latest.json for the page's
      # "free picks agree with our simulation" highlight. A source that is down or changed its page costs only its own picks; this
      # step must never block the refresh.
      - name: Free picks (fetch, log, grade)
        continue-on-error: true
        run: python free_picks.py fetch

      # Podcasts: each show's own RSS feed (show notes, and the transcript where the publisher supplies one). Public, no key, no cost;
      # picks are logged as pod:<show>. Must never block the refresh.
      - name: Podcast picks (RSS notes and transcripts)
        continue-on-error: true
        run: python podcast_picks.py fetch

      # YouTube: each listed channel's new uploads through the official Data API (about 3 quota units a channel of a 10,000 daily
      # allowance); picks in titles and descriptions are logged under yt:<channel>, new videos are listed on the Social Picks tab.
      # A no-op without YOUTUBE_API_KEY. Must never block the refresh.
      - name: YouTube picks (titles and descriptions)
        continue-on-error: true
        run: python youtube_picks.py fetch

      # Picks from X: pull posts newer than the last pull (at most max_posts_per_run, so a bounded spend), log the game picks they
      # contain and grade the ones whose games have finished. A no-op without X_BEARER_TOKEN and handles. Before the weekly report and
      # the props page so both see it; a failure here must never block the refresh.
      - name: Social picks (pull, log, grade)
        continue-on-error: true
        run: python social_picks.py refresh

      # The weekly report: how every pick did (moneyline tiers, spreads, totals, props) with a write-up per
      # market, and the learning step that re-measures how much the model deserves to be trusted from everything
      # graded so far (improve.py). It reports the latest week that is mostly graded, so Monday's run covers the
      # weekend and Thursday's run has the full week including Monday night. Runs before the props pull so any
      # re-measured weights apply to today's picks. A failure here must never block the refresh.
      - name: Weekly report and learning step
        if: steps.key.outputs.have_key == 'true'
        continue-on-error: true
        run: python weekly_report.py --html

      # Only games starting in the next 24 hours: about one slate of API credits per run.
      # That window is what makes each day's page right: Sunday morning = the Sunday slate and
      # Sunday night, Monday morning = Monday night's game alone, Thursday morning = Thursday
      # night's. The game-lines call also returns next week's posted games; those are logged
      # under their own week (for line-movement tracking) but not shown until their game day.
      # export_props.py logs every prop it prices to tracking/props_log.csv for future grading.
      - name: Rebuild props page
        if: steps.key.outputs.have_key == 'true'
        run: |
          # Saturday looks 2 days ahead so the whole Sunday slate (and Sunday night) is priced in one pull; every other run is a
          # single night game, so 1 day. A manual run any other day looks one day ahead too (use --days by hand for more).
          if [ "$(date -u +%u)" = "6" ]; then DAYS=2; else DAYS=1; fi
          python export_props.py --days "$DAYS"
          python web/build_props_page.py

      # Copies finished HTML pages only -- never the raw JSON snapshots.
      - name: Assemble site
        run: python web/build_site.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4

      # tracking/props_log.csv, web/track_record.json and web/player_history.json are this
      # workflow's memory: Actions runs are ephemeral, so they only persist by being committed
      # back to the repo. This holds our own logged predictions and results, never a
      # sportsbook's odds board. live_calibration.json is NOT committed -- it's cheaply
      # regenerated from the tracking log every run, so there's nothing to persist.
      - name: Commit the props tracking log
        if: steps.key.outputs.have_key == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports tracking/weekly_summary.csv tracking/learning_log.csv tracking/parlay_log.csv tracking/target_proj.csv tracking/dvp_log.csv tracking/social_picks.csv tracking/social_state.json tracking/free_picks_latest.json tracking/youtube_state.json tracking/youtube_latest.json tracking/podcast_state.json tracking/podcast_latest.json trust_weights.json tracking/props_log.csv tracking/line_history.csv tracking/power_history.csv tracking/player_model_record.csv tracking/weather_history.csv web/track_record.json web/player_history.json
          git diff --cached --quiet && echo "No tracker changes." || git commit -m "Update props tracking log [skip ci]"
          git checkout -- .   # discard regenerated build outputs (already published) so the rebase can run
          git pull --rebase -X theirs origin main   # a concurrent run edited the same files: this run's rows win (upsert semantics)
          git push
