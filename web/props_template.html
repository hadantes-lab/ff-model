<meta charset="utf-8">
<title>Props Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #12151b;
    --surface: #1b2028;
    --surface-2: #242a34;
    --surface-3: #2e3542;
    --border: #333b48;
    --text: #e9eaed;
    --text-dim: #98a0ac;
    --text-faint: #7a8391;
    --gold: #d9a441;
    --gold-dim: #7a6535;
    --gold-ink: #16130a;
    --pos: #5cb88a;
    --pos-bg: #1f3128;
    --neg: #d9705f;
    --neg-bg: #3a2622;
    --warn: #d9a441;
    --warn-bg: #3b3220;
    --bar: #3a4352;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f2ee; --surface: #ffffff; --surface-2: #ece9e2; --surface-3: #e1ddd3;
      --border: #d8d3c8; --text: #201d17; --text-dim: #5c574c; --text-faint: #736e60;
      --gold: #a1731d; --gold-dim: #cba15c; --gold-ink: #ffffff;
      --pos: #226b48; --pos-bg: #dcf0e5; --neg: #b5432f; --neg-bg: #f8dfd9;
      --warn: #8a5f0d; --warn-bg: #f6e8c6; --bar: #cfc9bb;
      --shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f2ee; --surface: #ffffff; --surface-2: #ece9e2; --surface-3: #e1ddd3;
    --border: #d8d3c8; --text: #201d17; --text-dim: #5c574c; --text-faint: #736e60;
    --gold: #a1731d; --gold-dim: #cba15c; --gold-ink: #ffffff;
    --pos: #226b48; --pos-bg: #dcf0e5; --neg: #b5432f; --neg-bg: #f8dfd9;
    --warn: #8a5f0d; --warn-bg: #f6e8c6; --bar: #cfc9bb;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, select, input { font-family: inherit; color: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible, .row-head:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { font-family: "Barlow Condensed", ui-sans-serif, sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ---- header ---- */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar .wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-top: 14px; padding-bottom: 14px; }
  .brand h1 { font-size: 24px; }
  .brand .accent { color: var(--gold); }
  .meta { color: var(--text-faint); font-size: 12.5px; }
  .stats { display: flex; gap: 10px; margin-left: auto; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px 14px; min-width: 92px; text-align: center; }
  .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 600; }
  .stat .v { font-family: "IBM Plex Mono"; font-weight: 600; font-size: 19px; }
  .stat.hi .v { color: var(--gold); }

  .demo-banner { background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600; }
  .demo-banner .wrap { padding-top: 9px; padding-bottom: 9px; }

  /* ---- controls ---- */
  .controls { padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .ctl-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    border-radius: 999px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .chip-btn[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: transparent; color: var(--text-dim); font-weight: 600; font-size: 13px;
    padding: 6px 13px; border-radius: 6px; cursor: pointer; }
  .seg button.active { background: var(--gold); color: var(--gold-ink); }
  .field { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; font-size: 13.5px; }
  .field::placeholder { color: var(--text-faint); }
  .check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
  .check input { accent-color: var(--gold); width: 15px; height: 15px; }
  .spacer { margin-left: auto; }

  /* ---- prop list ---- */
  .list { padding: 14px 0 60px; }
  .cols, .row-head { display: grid; gap: 12px; align-items: center;
    grid-template-columns: minmax(190px, 1.7fr) 118px 130px 88px minmax(140px, 1.1fr) 84px 22px; }
  .cols { padding: 0 16px 6px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); font-weight: 600; }
  .cols .r, .row-head .r { text-align: right; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; }
  .game-card { padding: 14px 16px; margin-bottom: 10px; }
  .game-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .game-head .teams { font-family: "Barlow Condensed"; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: 17px; }
  .game-body { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.6fr); gap: 16px; }
  .game-proj { display: flex; flex-direction: column; gap: 3px; justify-content: center; }
  .game-proj .side { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
  .game-proj .side b { font-family: "IBM Plex Mono"; }
  .mk-row { display: grid; grid-template-columns: 74px 90px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); }
  .mk-row:first-child { border-top: none; }
  .mk-row .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 600; }
  .mk-row .line { font-family: "IBM Plex Mono"; font-weight: 600; }
  .mk-row .probs { font-size: 13px; }
  .mk-row .probs .raw { color: var(--text-faint); font-size: 11.5px; margin-left: 4px; }
  .mk-row .pick { text-align: right; font-size: 12.5px; }
  .mk-row .pick .side-name { font-weight: 700; }
  @media (max-width: 720px) { .game-body { grid-template-columns: 1fr; } .mk-row { grid-template-columns: 1fr 1fr; row-gap: 4px; } .mk-row .pick { grid-column: 1 / -1; text-align: left; } }
  .row.open { border-color: var(--gold-dim); }
  .row-head { width: 100%; padding: 11px 16px; cursor: pointer; background: none; border: none; text-align: left; }
  .who .name { font-weight: 600; line-height: 1.25; }
  .who .sub { font-size: 12px; color: var(--text-faint); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px;
    background: var(--surface-3); color: var(--text-dim); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .mk .lbl { font-size: 12px; color: var(--text-dim); }
  .mk .line { font-family: "IBM Plex Mono"; font-weight: 600; font-size: 18px; }
  .model .mean { font-family: "IBM Plex Mono"; font-weight: 600; }
  .model .pair, .price .pair { font-size: 11.5px; color: var(--text-faint); }
  .edge { font-family: "IBM Plex Mono"; font-weight: 600; text-align: right; }
  .edge.pos { color: var(--pos); } .edge.neg { color: var(--neg); } .edge.flat { color: var(--text-dim); }
  .pick .side { font-weight: 700; font-size: 12.5px; letter-spacing: 0.04em; }
  .pick .side.over { color: var(--gold); }
  .pick .book { font-size: 11.5px; color: var(--text-faint); }
  .ev { font-family: "IBM Plex Mono"; font-weight: 700; text-align: right; padding: 3px 8px; border-radius: 7px; justify-self: end; font-size: 13px; }
  .ev.pos { background: var(--pos-bg); color: var(--pos); }
  .ev.neg { background: var(--neg-bg); color: var(--neg); }
  .ev.flat { background: var(--surface-2); color: var(--text-dim); }
  .caret { color: var(--text-faint); transition: transform .15s; }
  .row.open .caret { transform: rotate(90deg); }

  .more { display: block; margin: 12px auto 0; padding: 9px 22px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); font-weight: 600; cursor: pointer; }
  .empty { padding: 50px 0; text-align: center; color: var(--text-faint); }

  /* ---- detail ---- */
  .detail { border-top: 1px solid var(--border); padding: 16px; display: grid; gap: 22px;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  .panel h3 { font-size: 13px; color: var(--text-faint); letter-spacing: 0.06em; margin-bottom: 8px; }
  svg.chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--text-faint); font-size: 10px; font-family: "IBM Plex Mono"; }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-faint); margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .fact { background: var(--surface-2); border-radius: 8px; padding: 7px 10px; }
  .fact .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
  .fact .v { font-family: "IBM Plex Mono"; font-weight: 600; font-size: 14px; }

  .whatif { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .whatif label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; display: block; margin-bottom: 3px; }
  .whatif input { width: 100%; font-family: "IBM Plex Mono"; font-weight: 600; font-size: 14px; }
  .results { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .res { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .res .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; }
  .res .v { font-family: "IBM Plex Mono"; font-weight: 700; font-size: 16px; }
  .res .v.pos { color: var(--pos); } .res .v.neg { color: var(--neg); }
  .res .sub { font-size: 11px; color: var(--text-faint); }

  .log { display: flex; align-items: flex-end; gap: 5px; height: 84px; margin-top: 4px; }
  .log .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
  .log .bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
  .log .bar.hit { background: var(--pos); } .log .bar.miss { background: var(--bar); }
  .log .t { font-size: 9px; color: var(--text-faint); font-family: "IBM Plex Mono"; margin-top: 2px; white-space: nowrap; }
  .log .n { font-size: 10px; font-family: "IBM Plex Mono"; margin-bottom: 1px; color: var(--text-dim); }
  .log .bar { position: relative; overflow: visible; }
  .log .line-mark { position: absolute; left: -1px; right: -1px; height: 2px; background: var(--text); }
  table.books { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.books th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); padding: 3px 0; }
  table.books td { padding: 4px 0; border-top: 1px solid var(--border); font-family: "IBM Plex Mono"; }
  table.books td:first-child { font-family: "IBM Plex Sans"; }
  .note { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
  .foot { padding: 0 0 50px; color: var(--text-faint); font-size: 12.5px; max-width: 860px; }
  .foot p { margin: 0 0 8px; }
  .foot strong { color: var(--text-dim); }

  @media (max-width: 860px) {
    .cols { display: none; }
    .row-head { grid-template-columns: 1fr auto; row-gap: 7px; }
    .row-head .caret { display: none; }
    .row-head .mk { grid-column: 1; display: flex; gap: 8px; align-items: baseline; }
    .row-head .model { grid-column: 1; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .row-head .edge { text-align: left; }
    .row-head .pick { grid-column: 1; }
    .row-head .ev { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .detail { grid-template-columns: 1fr; }
    .stats { margin-left: 0; width: 100%; }
    .stat { flex: 1; min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
  .profile { margin-top:10px; }
  .profile summary { cursor:pointer; font-size:13px; color:var(--text-muted, inherit); }
  .ptable { border-collapse:collapse; margin:8px 0; font-size:13px; width:100%; max-width:460px; }
  .ptable th, .ptable td { text-align:right; padding:3px 8px; border-bottom:1px solid var(--border, rgba(128,128,128,.25)); }
  .ptable th:first-child, .ptable td:first-child { text-align:left; }
  .row.top-pick { border-color: var(--gold-dim);
    background: linear-gradient(90deg, rgba(217,164,65,0.13), rgba(217,164,65,0) 55%), var(--surface);
    box-shadow: 0 0 0 1px rgba(217,164,65,0.18), 0 0 26px -8px var(--gold); }
  .tag.gold { background: var(--gold); color: var(--gold-ink); }
  .tag.ok { background: var(--pos-bg); color: var(--pos); }
  .board { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .board h2 { font-size: 15px; margin-bottom: 2px; }
  .board .note { margin: 0 0 8px; }
  .brow { display: grid; grid-template-columns: 34px minmax(0,1.4fr) minmax(0,1.2fr) 64px minmax(0,1fr) 64px; gap: 10px; align-items: center;
    padding: 7px 8px; border-top: 1px solid var(--border); font-size: 13px; }
  .brow.head { border-top: none; color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .brow .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--gold); }
  .brow.glow { background: linear-gradient(90deg, rgba(217,164,65,0.12), rgba(217,164,65,0) 60%); border-radius: 8px; }
  .brow button.lnk { background: none; border: none; color: inherit; text-align: left; cursor: pointer; padding: 0; font: inherit; }
  .brow button.lnk:hover { text-decoration: underline; }
  .ptbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ptbl th, .ptbl td { padding: 6px 8px; text-align: right; border-top: 1px solid var(--border); white-space: nowrap; }
  .ptbl th { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-top: none; }
  .ptbl th:nth-child(2), .ptbl td:nth-child(2) { text-align: left; }
  .ptbl .up { color: var(--pos); } .ptbl .down { color: var(--neg); }
  .scroll-x { overflow-x: auto; }
  @media (max-width: 720px) {
    .brow { grid-template-columns: 28px 1fr 56px; row-gap: 2px; }
    .brow > :nth-child(3), .brow > :nth-child(5), .brow > :nth-child(6) { grid-column: 2 / span 2; }
  }
  .hc { grid-column: 1 / -1; }
  .hc-top { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; justify-content: space-between; margin-bottom: 6px; }
  .hc-stats { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .hc-stat .k { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .hc-stat .v { font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 600; }
  .hc-stat .v.pos { color: var(--pos); } .hc-stat .v.neg { color: var(--neg); }
  .hc-stat .s { font-size: 11px; color: var(--text-faint); }
  .hc-ctl { display: flex; flex-wrap: wrap; gap: 8px; }
  .hc-ctl .seg button { padding: 4px 10px; font-size: 12px; }
  .hc-ctl .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
  svg.hc-svg { width: 100%; height: auto; display: block; }
  .hc-svg text { fill: var(--text-faint); font-size: 10px; font-family: "IBM Plex Mono", monospace; }
  .hc-svg .val { fill: #fff; font-size: 11px; font-weight: 600; }
  .hc-svg .linelbl { fill: var(--gold); font-size: 11px; font-weight: 600; }
  /* ---- left rail ---- */
  #week-view { display: grid; grid-template-columns: 300px minmax(0, 1fr); column-gap: 20px; align-items: start;
    max-width: 1500px; margin: 0 auto; padding: 0 20px; }
  #week-view[hidden] { display: none; }
  #week-view > .rail { grid-column: 1; grid-row: 1 / span 12; position: sticky; top: 12px; align-self: start;
    max-height: calc(100vh - 24px); overflow-y: auto; margin-top: 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  #week-view > :not(.rail) { grid-column: 2; min-width: 0; }
  #week-view > .wrap { max-width: none; padding-left: 0; padding-right: 0; }
  .rail .field { width: 100%; margin-bottom: 8px; }
  .rail button { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; background: none; border: 1px solid transparent; }
  .rg { display: block; padding: 8px 10px; border-radius: 8px; }
  .rg:hover, .rp:hover { background: var(--surface-2); }
  .rg.sel { background: var(--surface-2); border-color: var(--gold-dim); }
  .rg .teams { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .rg .meta { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .rgame { margin-bottom: 2px; }
  .rplayers { margin: 2px 0 8px 8px; padding-left: 8px; border-left: 2px solid var(--border); }
  .rp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 6px 8px; border-radius: 8px; align-items: center; }
  .rp.sel { background: var(--surface-2); border-color: var(--gold-dim); }
  .rp .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rp .sub { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rp .ln { font-family: "IBM Plex Mono", monospace; font-size: 12px; text-align: right; }
  .rp .px { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--text-faint); text-align: right; }
  .rp .star { color: var(--gold); }
  .rail .rhead { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 6px 4px; }
  .pchip { display: inline-flex; align-items: center; gap: 6px; background: var(--gold); color: var(--gold-ink); font-weight: 700;
    font-size: 12px; padding: 4px 6px 4px 10px; border-radius: 99px; border: none; cursor: pointer; }
  @media (max-width: 960px) {
    #week-view { grid-template-columns: 1fr; }
    #week-view > .rail { grid-column: 1; grid-row: auto; position: static; max-height: 320px; margin-bottom: 4px; }
    #week-view > :not(.rail) { grid-column: 1; }
  }
</style>

<div class="topbar">
  <div class="wrap">
    <div class="brand">
      <h1><span class="accent">Props</span> Simulator</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>
<div class="wrap" style="padding-top:16px;">
  <div class="seg" id="view-tabs" role="group" aria-label="View">
    <button class="active" data-view="week">This Week</button>
    <button data-view="games">Game Lines</button>
    <button data-view="power">Power Rankings</button>
    <button data-view="history">Player History</button>
  </div>
</div>

<div id="week-view">
<aside class="rail" id="rail" aria-label="Games and players">
  <input class="field" id="q" type="search" placeholder="Search players or teams&hellip;" aria-label="Search players or teams">
  <div id="rail-list"></div>
</aside>
<div class="wrap" id="track-record" hidden></div>
<div class="wrap" id="top-picks" hidden style="padding-top:16px;"></div>
<div class="demo-banner" id="demo" hidden><div class="wrap">Demo lines &mdash; these prices were generated from the model itself to show the layout. They are not real sportsbook lines and any &ldquo;edge&rdquo; here is meaningless.</div></div>

<div class="wrap controls">
  <div class="ctl-row"><div class="chips" id="market-chips" role="group" aria-label="Markets"></div></div>
  <div class="ctl-row">
    <div class="seg" id="pos-seg" role="group" aria-label="Position">
      <button class="active" data-pos="">All</button><button data-pos="QB">QB</button><button data-pos="RB">RB</button><button data-pos="WR">WR</button><button data-pos="TE">TE</button>
    </div>
    <span id="player-chip"></span>
    <label class="check"><input type="checkbox" id="only-ev"> Model +EV only</label>
    <label class="check"><input type="checkbox" id="hide-thin"> Hide thin samples</label>
    <select class="field spacer" id="sort" aria-label="Sort">
      <option value="ev">Sort: best EV</option><option value="edge">Sort: biggest edge</option>
      <option value="name">Sort: player</option><option value="time">Sort: kickoff</option>
    </select>
  </div>
</div>

<div class="wrap list">
  <div class="cols"><div>Player</div><div>Line</div><div>Model</div><div class="r">Edge</div><div>Best price</div><div class="r">EV / $1</div><div></div></div>
  <div id="rows"></div>
</div>
</div>

<div class="wrap" id="games-view" hidden style="padding-top:18px; padding-bottom:60px;">
  <div id="games-list"></div>
</div>

<div class="wrap" id="power-view" hidden style="padding-top:18px; padding-bottom:60px;"></div>

<div class="wrap" id="history-view" hidden style="padding-top:18px; padding-bottom:60px;">
  <input class="field" id="hist-search" type="search" placeholder="Search a player&hellip;" style="width:260px; margin-bottom:12px;" aria-label="Search a player's history">
  <div id="hist-list" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;"></div>
  <div id="hist-detail"></div>
</div>

<div class="wrap foot" id="foot"></div>

<script>
const DATA = __PROPS_JSON__;
const TRACK = __TRACK_RECORD_JSON__;
const PLAYER_HISTORY = __PLAYER_HISTORY_JSON__;
const P = DATA.props.map((p, i) => Object.assign(p, { id: i }));

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const price = a => a == null ? "—" : (a > 0 ? "+" + a : String(a));
const dec = a => 1 + (a > 0 ? a / 100 : 100 / -a);
const evOf = (win, lose, a) => win * (dec(a) - 1) - lose;
const signed = (x, d = 1) => (x > 0 ? "+" : "") + x.toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sideName = (p, side) => side === "over" ? (p.kind === "td" ? "YES" : "OVER") : "UNDER";
const fmtLine = p => p.kind === "td" ? "Any TD" : String(p.line);

/* P(over / push / under) at ANY line, read back off the exported distribution */
function probsAt(p, line) {
  if (p.dist.pmf) {
    const pmf = p.dist.pmf; let over = 0, push = 0;
    pmf.forEach((m, k) => { if (k > line) over += m; else if (k === line) push += m; });
    return { over, push, under: Math.max(0, 1 - over - push) };
  }
  const q = p.dist.q;                                    // 0..100th percentiles
  let F;
  if (line <= q[0]) F = 0;
  else if (line >= q[100]) F = 1;
  else {
    let i = 0; while (q[i + 1] < line) i++;
    F = (i + (q[i + 1] === q[i] ? 0 : (line - q[i]) / (q[i + 1] - q[i]))) / 100;
  }
  return { over: 1 - F, push: 0, under: F };
}

/* ---------- header ---------- */
function renderTrackRecord() {
  const el = document.getElementById("track-record");
  if (!TRACK || !TRACK.n_graded) return;
  el.hidden = false;
  const roiClass = TRACK.roi_per_dollar > 0 ? "pos" : TRACK.roi_per_dollar < 0 ? "neg" : "flat";
  el.innerHTML = `<div class="row" style="padding:12px 16px; margin:14px 0 0;">
    <div style="display:flex; gap:22px; flex-wrap:wrap; align-items:baseline;">
      <div><span class="k" style="font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:600;">Track record</span>
        <div style="font-size:12.5px; color:var(--text-faint); margin-top:2px;">${TRACK.n_graded.toLocaleString()} graded props since tracking began</div></div>
      <div><div class="k" style="font-size:10.5px; color:var(--text-faint);">Pick win rate</div><div class="num" style="font-weight:700; font-size:16px;">${TRACK.pick_win_rate == null ? "—" : pct(TRACK.pick_win_rate, 1)}</div></div>
      <div><div class="k" style="font-size:10.5px; color:var(--text-faint);">ROI / $1</div><div class="num ev ${roiClass}" style="display:inline-block; font-size:16px;">${TRACK.roi_per_dollar == null ? "—" : signed(TRACK.roi_per_dollar * 100, 1) + "%"}</div></div>
    </div>
    <div class="note" style="margin-top:8px;">Flat $1-per-pick at the price recorded when logged, not a simulated bankroll -- and still a small, noisy sample this early. This is the model being checked against what actually happened, not a claim that it works.</div>
    ${(TRACK.big_moves || []).length ? `<div class="note" style="margin-top:8px;"><strong>Notable line moves since first pulled:</strong> ${TRACK.big_moves.slice(0, 5).map(m =>
      `${esc(m.player)} (${esc(m.market)}) ${m.opening_line} &rarr; ${m.line}`).join(" &middot; ")}</div>` : ""}
  </div>`;
}

function renderHeader() {
  const when = new Date(DATA.generated);
  $("meta").textContent = `Week ${DATA.week}, ${DATA.season} · ${DATA.n_games} games · lines pulled ${when.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}`;
  $("demo").hidden = !DATA.sample;
  const gaps = P.filter(p => p.edge != null && Math.abs(p.edge) >= 5 && !p.thin).length;
  $("stats").innerHTML = [
    ["Props", P.length.toLocaleString(), ""], ["Edges 5+ pt", gaps.toLocaleString(), "hi"], ["Games", DATA.n_games, ""],
  ].map(([k, v, c]) => `<div class="stat ${c}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("foot").innerHTML = `
    <p><strong>How it works.</strong> Each prop is simulated 20,000 times from the player's last 17 games (recent games weigh more), scaled for how the opposing defense treats that position. Counts (receptions, TDs) use Poisson / negative-binomial draws; yardage uses a skewed gamma. Anytime TD rates are pulled toward the position average so a scoreless streak doesn't read as impossible.</p>
    <p><strong>Validated against history.</strong> The projection engine was tested walk-forward on 2024&ndash;25 (each game projected using only earlier games). That found projections for high-usage players run about 5% hot, so they are calibrated back (this cut error on every market); it confirmed a defense-strength adjustment helps a little; and it showed the game total and spread genuinely move volume and yardage out of sample (higher totals lift receiving and passing-TD projections; favorites pass less). Man/zone coverage matchups turned out to be a very weak signal, so they move projections by well under 1%.</p>
    <p><strong>Adjusted vs raw.</strong> Against real lines the raw simulation differed from the market by about 12 points on a typical prop, when a genuine edge is a few points at most, so most of that gap is the model missing things the market knows (roles, injuries, weather, game script). Edge and EV therefore use the model <em>shrunk toward the market</em>: the market's price plus a small share (at most 15%, less for players with thin history) of the model's disagreement. That 15% is a judgment call, not a fitted number; calibrating it properly needs closing lines and game results. The raw model probability is shown next to it. Rows tagged &ldquo;model far from market&rdquo; are where the raw model disagrees most, and are the ones most likely to be model error.</p>
    <p><strong>Edge</strong> is adjusted P(over) minus the market's no-vig P(over), averaged across books. <strong>EV / $1</strong> uses the best price on the recommended side. Anytime TD has no &ldquo;under&rdquo; to remove the vig with, so its market number includes the vig, which makes its edges conservative. Thin samples (fewer than 6 games) are tagged.</p>
    <p>${DATA.credits ? esc(DATA.credits) + " · " : ""}Distributions are simulated from nflverse play data; lines from The Odds API.</p>`;
}

/* ---------- filters + list ---------- */
const S = { markets: new Set(), pos: "", game: "", player: null, q: "", sort: "ev", onlyEv: false, hideThin: false, limit: 80, open: null };

function buildControls() {
  const labels = [...new Map(P.map(p => [p.market, p.label]))];
  $("market-chips").innerHTML = labels.map(([m, l]) => `<button class="chip-btn" aria-pressed="false" data-m="${m}">${esc(l)}</button>`).join("");
}

function visible() {
  const q = S.q.trim().toLowerCase();
  let rows = P.filter(p =>
    (!S.markets.size || S.markets.has(p.market)) && (!S.pos || p.pos === S.pos) && (!S.game || p.game === S.game) && (!S.player || p.player === S.player) &&
    (!q || p.player.toLowerCase().includes(q) || p.team.toLowerCase().includes(q) || p.game.toLowerCase().includes(q)) && (!S.onlyEv || (p.pick_ev != null && p.pick_ev > 0)) && (!S.hideThin || !p.thin));
  const key = { ev: p => -(p.pick_ev ?? -9), edge: p => -Math.abs(p.edge ?? 0), name: p => p.player, time: p => p.commence + p.player }[S.sort];
  return rows.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });
}

function rowHTML(p) {
  const e = p.edge, ec = e == null ? "flat" : e > 1 ? "pos" : e < -1 ? "neg" : "flat";
  const pick = p.pick ? p[p.pick === "over" ? "best_over" : "best_under"] : null;
  const evc = p.pick_ev == null ? "flat" : p.pick_ev > 0.005 ? "pos" : p.pick_ev < -0.005 ? "neg" : "flat";
  const big = p.gap != null && Math.abs(p.gap) >= 12;
  return `<div class="row ${S.open === p.id ? "open" : ""} ${p.top_rank ? "top-pick" : ""}" data-id="${p.id}">
    <div class="row-head" role="button" tabindex="0" aria-expanded="${S.open === p.id}">
      <div class="who"><div class="name">${esc(p.player)}</div>
        <div class="sub"><span>${p.team} ${p.home ? "vs" : "@"} ${p.opp}</span><span class="tag">${p.pos}</span>${p.top_rank ? `<span class="tag gold" title="One of the week's 10 best prop picks by expected value">Top ${p.top_rank}</span>` : ""}
          ${p.injury ? `<span class="tag warn">${esc(p.injury)}</span>` : ""}${p.promoted ? `<span class="tag" title="A teammate ahead of him in usage is Out/Doubtful/IR; his volume is scaled x${p.promoted} toward the team's rate">backup starting</span>` : ""}${p.thin ? `<span class="tag warn">${p.n_games} games</span>` : ""}${p.env && Math.abs(p.env.mult - 1) >= 0.04 ? `<span class="tag" title="Game total ${p.env.total}, ${p.team} implied ${p.env.implied}: moves the projection ${signed((p.env.mult - 1) * 100, 1)}%">${p.env.total} total ${signed((p.env.mult - 1) * 100, 0)}%</span>` : ""}${p.dfs && p.dfs.some(d => d.gap !== 0) ? `<span class="tag">pick'em line differs</span>` : ""}${big ? `<span class="tag warn" title="The raw model is ${Math.abs(p.gap).toFixed(0)} points from the market, far more than a real edge usually is">model far from market</span>` : ""}</div></div>
      <div class="mk"><div class="lbl">${esc(p.label)}</div><div class="line">${fmtLine(p)}</div></div>
      <div class="model"><div class="mean">${p.kind === "td" ? pct(p.over, 1) : "μ " + p.mean}</div>
        <div class="pair">${p.kind === "td" ? "P(TD) adj" : "P(over) adj " + pct(p.over)} · raw ${pct(p.model_over)}${p.market_over != null ? ` · mkt ${pct(p.market_over)}${p.fair_over == null ? "*" : ""}` : ""}</div></div>
      <div class="edge ${ec}">${e == null ? "—" : signed(e) + " pt"}</div>
      <div class="pick">${pick ? `<div class="side ${p.pick}">${sideName(p, p.pick)} <span class="num">${price(pick.price)}</span></div><div class="book">${esc(pick.book)}</div>` : "—"}</div>
      <div class="ev ${evc} num">${p.pick_ev == null ? "—" : signed(p.pick_ev * 100, 1) + "%"}</div>
      <div class="caret" aria-hidden="true">›</div>
    </div>
    ${S.open === p.id ? `<div class="detail" id="detail-${p.id}"></div>` : ""}
  </div>`;
}

function renderList() {
  const rows = visible(), shown = rows.slice(0, S.limit);
  $("rows").innerHTML = rows.length
    ? shown.map(rowHTML).join("") + (rows.length > shown.length ? `<button class="more" id="more">Show ${Math.min(80, rows.length - shown.length)} more (${rows.length - shown.length} hidden)</button>` : "")
    : `<div class="empty">No props match these filters.</div>`;
  if (S.open != null && $("detail-" + S.open)) renderDetail(P[S.open]);
}

/* ---------- hit-rate chart ---------- */
/* HITRATE:BEGIN -- pure functions (no DOM); tests/test_hitrate.py runs these under node */
function hitSelect(games, hc) {
  let g = games.slice();
  if (hc.ha === "home") g = g.filter(x => x[4] === 1);
  else if (hc.ha === "away") g = g.filter(x => x[4] === 0);
  if (hc.win === "season") {
    const s = Math.max(...games.map(x => x[0]));
    g = g.filter(x => x[0] === s);
  } else if (hc.win !== "all") g = g.slice(-hc.win);
  return g;
}
function hitResult(v, line, kind) {
  if (kind === "td") return v >= 1 ? "over" : "under";
  return v > line ? "over" : v < line ? "under" : "push";
}
function hitStats(games, line, kind, mode) {
  const res = games.map(x => hitResult(x[3], mode === "then" && x[6] != null ? x[6] : line, kind));
  const over = res.filter(r => r === "over").length, under = res.filter(r => r === "under").length;
  const vals = games.map(x => x[3]).sort((a, b) => a - b);
  const mid = vals.length ? (vals.length % 2 ? vals[(vals.length - 1) / 2] : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2) : null;
  return { n: games.length, over, under, push: res.length - over - under, results: res,
    pct: over + under ? over / (over + under) : null,
    avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null, median: mid };
}
/* HITRATE:END */

const HC = { win: 10, ha: "all", mode: "now" };
const HC_WINS = [[5, "L5"], [10, "L10"], [15, "L15"], ["season", "Season"], ["all", "All"]];

function renderHit(p, line) {
  const el = $("hc-" + p.id);
  if (!el) return;
  const all = p.games || [];
  if (!all.length) { el.innerHTML = `<h3>Game log</h3><div class="note">No game log available for this player.</div>`; return; }
  const hasThen = all.some(g => g[6] != null);
  if (HC.mode === "then" && !hasThen) HC.mode = "now";
  const sel = hitSelect(all, HC), st = hitStats(sel, line, p.kind, HC.mode);
  const implied = p.market_over != null ? p.market_over : null;
  const edgeCls = st.pct == null || implied == null ? "" : st.pct > implied + 0.03 ? "pos" : st.pct < implied - 0.03 ? "neg" : "";
  const seg = (items, cur, key) => `<div class="seg" data-hc="${key}">${items.map(([v, l]) => `<button data-v="${v}" class="${String(cur) === String(v) ? "active" : ""}">${l}</button>`).join("")}</div>`;

  /* chart */
  const W = 760, H = 250, padL = 8, padR = 44, top = 24, base = H - 46;
  const n = sel.length, slots = n + 1;                               // + the upcoming game
  const thresholds = sel.map(x => HC.mode === "then" && x[6] != null ? x[6] : line);
  const maxv = Math.max(1, line, ...sel.map(x => x[3]), ...thresholds) * 1.12;
  const sy = v => base - (v / maxv) * (base - top);
  const slot = (W - padL - padR) / Math.max(slots, 1), bw = Math.min(46, slot * 0.7);
  const bars = sel.map((g, i) => {
    const x = padL + slot * i + (slot - bw) / 2, h = Math.max(2, base - sy(g[3])), res = st.results[i];
    const col = res === "over" ? "var(--pos)" : res === "under" ? "var(--neg)" : "var(--bar)";
    const lbl = (g[4] === 0 ? "@" : "") + g[2];
    const date = g[5] ? new Date(g[5] + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" }) : `wk ${g[1]}`;
    const showDate = slot >= 30;
    const own = HC.mode === "then" && g[6] != null
      ? `<line x1="${x - 3}" x2="${x + bw + 3}" y1="${sy(g[6]).toFixed(1)}" y2="${sy(g[6]).toFixed(1)}" stroke="var(--gold)" stroke-width="2.5"/>` : "";
    return `<g><title>${g[0]} wk ${g[1]} ${g[4] === 0 ? "at" : "vs"} ${g[2]}: ${g[3]}${g[6] != null ? ` (line then ${g[6]})` : ""}</title>
      <rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"/>
      ${h > 16 ? `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(base - h + 13).toFixed(1)}" text-anchor="middle">${Math.round(g[3])}</text>` : `<text x="${(x + bw / 2).toFixed(1)}" y="${(base - h - 4).toFixed(1)}" text-anchor="middle">${Math.round(g[3])}</text>`}
      ${own}
      <text x="${(x + bw / 2).toFixed(1)}" y="${base + 13}" text-anchor="middle">${slot >= 22 ? esc(lbl) : ""}</text>
      <text x="${(x + bw / 2).toFixed(1)}" y="${base + 25}" text-anchor="middle">${showDate ? date : ""}</text></g>`;
  }).join("");
  const ux = padL + slot * n + (slot - bw) / 2;
  const upcoming = `<g><rect x="${ux.toFixed(1)}" y="${top}" width="${bw.toFixed(1)}" height="${(base - top).toFixed(1)}" rx="3" fill="none" stroke="var(--text-faint)" stroke-dasharray="4 3"/>
    <text x="${(ux + bw / 2).toFixed(1)}" y="${(top + (base - top) / 2).toFixed(1)}" text-anchor="middle" style="font-size:16px">?</text>
    <text x="${(ux + bw / 2).toFixed(1)}" y="${base + 13}" text-anchor="middle">${p.home ? "" : "@"}${esc(p.opp)}</text><text x="${(ux + bw / 2).toFixed(1)}" y="${base + 25}" text-anchor="middle">next</text></g>`;
  const showNow = HC.mode === "now";
  const ly = sy(line).toFixed(1);
  const svg = `<svg class="hc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Game-by-game results against the line">
    <line x1="${padL}" x2="${W - padR + 4}" y1="${base}" y2="${base}" stroke="var(--border)"/>
    ${bars}${upcoming}
    ${showNow ? `<line x1="${padL}" x2="${W - padR + 4}" y1="${ly}" y2="${ly}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="linelbl" x="${W - padR + 8}" y="${(+ly + 4).toFixed(1)}">${line}</text>` : ""}
  </svg>`;

  const f1 = x => x == null ? "&mdash;" : (Math.abs(x) >= 100 ? Math.round(x) : x.toFixed(1));
  el.innerHTML = `
    <div class="hc-top">
      <div class="hc-stats">
        <div class="hc-stat"><div class="k">Hit rate (over)</div><div class="v ${edgeCls}">${st.pct == null ? "&mdash;" : Math.round(st.pct * 100) + "%"} <span style="font-size:13px; font-weight:500; color:var(--text-dim)">(${st.over} of ${st.over + st.under})</span></div>
          <div class="s">${implied == null ? "" : `Market implies ${pct(implied)} over`}${st.push ? ` &middot; ${st.push} push` : ""}</div></div>
        <div class="hc-stat"><div class="k">Under</div><div class="v">${st.pct == null ? "&mdash;" : Math.round((1 - st.pct) * 100) + "%"}</div></div>
        <div class="hc-stat"><div class="k">Average</div><div class="v">${f1(st.avg)}</div><div class="s">${p.kind === "td" ? "TDs/game" : `${st.avg == null ? "" : signed(st.avg - line, 1) + " vs line"}`}</div></div>
        <div class="hc-stat"><div class="k">Median</div><div class="v">${f1(st.median)}</div></div>
        <div class="hc-stat"><div class="k">Games</div><div class="v">${st.n}</div></div>
      </div>
      <div class="hc-ctl">${seg(HC_WINS, HC.win, "win")}${seg([["all", "All"], ["home", "Home"], ["away", "Away"]], HC.ha, "ha")}
        <div class="seg" data-hc="mode"><button data-v="now" class="${HC.mode === "now" ? "active" : ""}">Today's line</button><button data-v="then" class="${HC.mode === "then" ? "active" : ""}" ${hasThen ? "" : "disabled"} title="${hasThen ? "Compare each game with the line it actually had when we logged it" : "No past lines logged for this player yet"}">Line then</button></div></div>
    </div>
    ${n ? svg : `<div class="empty" style="padding:30px 0;">No games match these filters.</div>`}
    <div class="legend"><span><i style="background:var(--pos)"></i>${p.kind === "td" ? "scored" : "over"}</span><span><i style="background:var(--neg)"></i>${p.kind === "td" ? "no TD" : "under"}</span>${st.push ? `<span><i style="background:var(--bar)"></i>push</span>` : ""}<span>${HC.mode === "then" ? "gold ticks = the line that game had" : "dashed line = " + (p.kind === "td" ? "any TD" : "the line (edit it under Your line & odds)")}</span><span>@ = away</span></div>
    ${HC.mode === "now" && p.kind !== "td" ? `<div class="note">Hit rate here is each past game measured against <em>today's</em> line, i.e. "if this line had been set then". Switch to <strong>Line then</strong> to use the line each game really had, available for games we were already logging${hasThen ? "" : " (none for this player yet; it builds up every week)"}.</div>` : ""}`;
}

/* ---------- detail ---------- */
function chartSVG(p, line) {
  const W = 600, H = 150, pad = 18, base = H - 22, top = 8;
  let bars = [];                                          // [x0label, mass, x0, x1]
  if (p.dist.pmf) {
    p.dist.pmf.forEach((m, k) => bars.push({ lo: k - 0.5, hi: k + 0.5, m, over: k > line }));
  } else {
    const q = p.dist.q, hiX = q[99] * 1.03 || 1, n = 36;
    for (let i = 0; i < n; i++) {
      const a = hiX * i / n, b = hiX * (i + 1) / n;
      const m = (1 - probsAt(p, a).over) - (1 - probsAt(p, b).over);
      bars.push({ lo: a, hi: b, m: Math.max(0, m), over: (a + b) / 2 > line });
    }
  }
  const xmin = bars[0].lo, xmax = bars[bars.length - 1].hi, sx = x => pad + (x - xmin) / (xmax - xmin) * (W - 2 * pad);
  const mmax = Math.max(...bars.map(b => b.m)) || 1;
  const rects = bars.map(b => {
    const h = (b.m / mmax) * (base - top), x = sx(b.lo), w = Math.max(1, sx(b.hi) - sx(b.lo) - 1.5);
    return `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${b.over ? "var(--gold)" : "var(--bar)"}" opacity="${b.over ? 0.9 : 1}"/>`;
  }).join("");
  const lx = sx(Math.min(Math.max(line, xmin), xmax)), mx = sx(Math.min(Math.max(p.mean, xmin), xmax));
  let tickVals;
  if (p.dist.pmf) { const step = Math.max(1, Math.ceil(p.dist.pmf.length / 7)); tickVals = p.dist.pmf.map((_, k) => k).filter(k => k % step === 0); }
  else tickVals = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(Math.max(0, xmin + f * (xmax - xmin))));
  const ticks = tickVals.map(v => `<text x="${sx(v).toFixed(1)}" y="${H - 6}" text-anchor="middle">${v}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Simulated distribution with the line marked">
    ${rects}<line x1="${mx.toFixed(1)}" x2="${mx.toFixed(1)}" y1="${top}" y2="${base}" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="${lx.toFixed(1)}" x2="${lx.toFixed(1)}" y1="${top - 4}" y2="${base}" stroke="var(--text)" stroke-width="2"/>
    <line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" stroke="var(--border)"/>${ticks}</svg>`;
}

const HS = { pid: null, market: null };

function historyChartHTML(games, kind) {
  const H = 58;
  const maxv = Math.max(1, ...games.map(g => Math.max(g.actual, g.line)));
  return `<div class="log">` + games.map(g => {
    const barH = Math.max(3, g.actual / maxv * H);
    const lineY = Math.min(H + 20, g.line / maxv * H);
    const cls = g.result === "over" ? "hit" : g.result === "under" ? "miss" : "";
    const n = kind === "yards" ? Math.round(g.actual) : g.actual;
    return `<div class="b" title="Week ${g.week} vs ${g.opp}: actual ${g.actual}, line ${g.line} (${g.result})">
      <div class="n">${n}</div>
      <div class="bar ${cls}" style="height:${barH}px"><div class="line-mark" style="bottom:${lineY}px"></div></div>
      <div class="t">W${g.week}</div>
    </div>`;
  }).join("") + `</div>`;
}

    ? `Early-season sample (n_eff ${g.n_eff}) -- only up to ${pct(trust)} of the model's own view is trusted here; the rest defers to the market.`
    : `n_eff ${g.n_eff} across ${g.n_players} simulated players -- spread trust ${pct(g.spread_trust)}, total trust ${pct(g.total_trust)}.`;
  const predNote = `Model's own line (before seeing the market): <strong>${esc(predSpreadLine)}</strong> (${signed(g.spread_gap, 1)} vs posted) &middot; total <strong>${g.predicted_total}</strong> (${signed(g.total_gap, 1)} vs posted).`;

/* ---------- left rail: games -> players ---------- */
/* RAIL:BEGIN -- pure functions (no DOM); tests/test_rail.py runs these under node */
const RAIL_POS = { QB: 0, RB: 1, WR: 2, TE: 3, FB: 4 };
const RAIL_FEATURED = { QB: "player_pass_yds", RB: "player_rush_yds", WR: "player_reception_yds", TE: "player_reception_yds", FB: "player_rush_yds" };
function railFeatured(props) {                     // the one prop to show under a player's name
  const want = RAIL_FEATURED[props[0].pos];
  return props.find(p => p.market === want) || props[0];
}
function railModel(props, gameLines, q) {
  q = (q || "").trim().toLowerCase();
  const games = new Map();
  props.forEach(p => {
    if (!games.has(p.game)) games.set(p.game, { game: p.game, commence: p.commence, players: new Map(), n: 0 });
    const g = games.get(p.game);
    g.n++;
    const key = p.player_id || p.player;
    if (!g.players.has(key)) g.players.set(key, []);
    g.players.get(key).push(p);
  });
  const lines = new Map((gameLines || []).map(g => [g.game, g]));
  const out = [];
  games.forEach(g => {
    const [away, home] = g.game.split(" @ ");
    const gameMatch = !q || g.game.toLowerCase().includes(q);
    let players = [...g.players.values()].map(list => ({ name: list[0].player, pos: list[0].pos, team: list[0].team,
      feat: railFeatured(list), n: list.length, top: list.some(p => p.top_rank) }));
    if (q && !gameMatch) players = players.filter(pl => pl.name.toLowerCase().includes(q) || pl.team.toLowerCase().includes(q));
    if (!gameMatch && !players.length) return;
    players.sort((a, b) => (RAIL_POS[a.pos] ?? 9) - (RAIL_POS[b.pos] ?? 9) || b.feat.line - a.feat.line || a.name.localeCompare(b.name));
    const gl = lines.get(g.game);
    out.push({ game: g.game, away, home, commence: g.commence, n: g.n, spread: gl ? gl.home_spread : null, total: gl ? gl.total : null,
      searching: !!q, players });
  });
  return out.sort((a, b) => a.commence.localeCompare(b.commence));
}
/* RAIL:END */

function renderRail() {
  const model = railModel(P, DATA.games, S.q);
  const spreadTxt = g => g.spread == null ? "" : (g.spread <= 0 ? `${g.home} ${g.spread}` : `${g.away} ${-g.spread}`);
  $("rail-list").innerHTML = `<button class="rg ${!S.game && !S.player ? "sel" : ""}" data-game="" data-clear="1"><div class="teams"><span>All games</span><span class="num" style="font-weight:500;color:var(--text-faint)">${P.length}</span></div></button>
    ${model.length ? "" : `<div class="note" style="padding:8px;">Nothing matches.</div>`}
    ${model.map(g => {
      const open = S.game === g.game || g.searching;
      return `<div class="rgame"><button class="rg ${S.game === g.game && !S.player ? "sel" : ""}" data-game="${esc(g.game)}">
        <div class="teams"><span>${esc(g.away)} @ ${esc(g.home)}</span><span class="num" style="font-weight:500;color:var(--text-faint)">${g.n}</span></div>
        <div class="meta"><span>${new Date(g.commence).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</span>
          ${g.spread != null ? `<span>${esc(spreadTxt(g))}</span>` : ""}${g.total != null ? `<span>O/U ${g.total}</span>` : ""}</div></button>
        ${open ? `<div class="rplayers">${g.players.map(pl => {
          const f = pl.feat, bo = f.best_over, bu = f.best_under;
          return `<button class="rp ${S.player === pl.name ? "sel" : ""}" data-player="${esc(pl.name)}" data-game="${esc(g.game)}">
            <div class="nm">${pl.top ? `<span class="star" title="One of the week's top 10 picks">&#9733;</span> ` : ""}${esc(pl.name)}</div>
            <div class="ln">${f.kind === "td" ? "Any TD" : f.line}</div>
            <div class="sub">${pl.pos} &middot; ${esc(pl.team)} &middot; ${esc(f.label)}</div>
            <div class="px">${bo && bu ? `${price(bo.price)}/${price(bu.price)}` : ""}</div></button>`;
        }).join("")}</div>` : ""}</div>`;
    }).join("")}`;
  $("player-chip").innerHTML = S.player ? `<button class="pchip" id="clear-player" title="Show everyone again">${esc(S.player)} <span aria-hidden="true">&#10005;</span></button>` : "";
}

function railSelect(game, player) {
  if (player) {
    S.markets.clear(); S.pos = ""; S.onlyEv = false; S.hideThin = false;
    document.querySelectorAll("#market-chips button").forEach(b => b.setAttribute("aria-pressed", "false"));
    document.querySelectorAll("#pos-seg button").forEach(b => b.classList.toggle("active", b.dataset.pos === ""));
    $("only-ev").checked = false; $("hide-thin").checked = false;
    S.game = game; S.player = player;
    const mine = P.filter(p => p.player === player && p.game === game);
    S.open = mine.length ? railFeatured(mine).id : null;
  } else {
    S.game = game; S.player = null; S.open = null;
  }
  S.limit = 80;
  renderRail(); renderList();
  if (S.open != null) { const row = document.querySelector(`.row[data-id="${S.open}"]`); if (row) row.scrollIntoView({ block: "start", behavior: "smooth" }); }
}

  if (!top.length) return;
  el.innerHTML = `<div class="board"><h2>Top 10 prop picks this week</h2>
    <div class="note">Ranked by expected value of the recommended side, using the model shrunk toward the market. Excluded: anytime TDs, thin samples, injured players, and props where the raw model is far from the market. One pick per player. Treat these as the model's strongest leanings, not sure things: see the track record above for how each market has actually done.</div>
    <div class="brow head"><div>#</div><div>Player</div><div>Pick</div><div>Prob</div><div>Best price</div><div style="text-align:right;">EV / $1</div></div>
    ${top.map(p => {
      const side = p.pick, pr = p[side === "over" ? "best_over" : "best_under"];
      return `<div class="brow glow"><div class="n">${p.top_rank}</div>
        <div><button class="lnk" data-open="${p.id}"><strong>${esc(p.player)}</strong></button><div class="sub" style="color:var(--text-faint); font-size:12px;">${p.team} ${p.home ? "vs" : "@"} ${p.opp} &middot; ${esc(p.label)}</div></div>
        <div>${sideName(p, side)}</div>
        <div class="num">${pct(side === "over" ? p.over : p.under)}</div>
        <div>${pr ? `<span class="num">${price(pr.price)}</span> <span style="color:var(--text-faint)">${esc(pr.book)}</span>` : "&mdash;"}</div>
        <div class="num ev pos" style="text-align:right;">${signed(p.pick_ev * 100, 1)}%</div></div>`;
    }).join("")}</div>`;
}

function openProp(id) {
  S.markets.clear(); S.pos = ""; S.game = ""; S.player = null; S.q = ""; S.onlyEv = false; S.hideThin = false; S.limit = 1000; S.open = id;
  document.querySelectorAll("#market-chips button").forEach(b => b.setAttribute("aria-pressed", "false"));
  document.querySelectorAll("#pos-seg button").forEach(b => b.classList.toggle("active", b.dataset.pos === ""));
  $("q").value = ""; $("only-ev").checked = false; $("hide-thin").checked = false;
  renderRail(); renderList();
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
}

/* ---------- game pick board + power rankings ---------- */
function pickBoardHTML() {
  const picks = DATA.game_picks || [];
  if (!picks.length) return "";
  return `<div class="board"><h2>Game picks ranked by confidence</h2>
    <div class="note">Confidence is the model's probability for the picked side after shrinking toward the market (so it stays close to 50%: that is deliberate, since the simulator has no proven edge over the line yet). "Rating agrees" means the power-ranking spread leans the same way.</div>
    <div class="brow head"><div>#</div><div>Game</div><div>Pick</div><div>Conf.</div><div>Best price</div><div style="text-align:right;">EV / $1</div></div>
    ${picks.map(e => `<div class="brow ${e.rank <= 3 ? "glow" : ""}"><div class="n">${e.rank}</div>
      <div>${esc(e.game)}</div>
      <div><strong>${esc(e.pick)}</strong> <span class="tag">${e.type}</span>${e.rank_agrees === true ? ` <span class="tag ok" title="The power-ranking spread leans the same way">rating agrees</span>` : e.rank_agrees === false ? ` <span class="tag warn" title="The power-ranking spread leans the other way">rating disagrees</span>` : ""}</div>
      <div class="num">${pct(e.prob)}</div>
      <div>${e.price ? `<span class="num">${price(e.price.price)}</span> <span style="color:var(--text-faint)">${esc(e.price.book)}</span>` : "&mdash;"}</div>
      <div class="num ${e.ev == null ? "" : e.ev > 0.005 ? "ev pos" : "ev neg"}" style="text-align:right;">${e.ev == null ? "&mdash;" : signed(e.ev * 100, 1) + "%"}</div></div>`).join("")}</div>`;
}

function rankLineHTML(g) {
  const r = g.rank;
  if (!r) return "";
  const spreadTxt = r.rank_spread <= 0 ? `${g.home} ${r.rank_spread}` : `${g.away} ${-r.rank_spread}`;
  const qb = r.qb_adjust ? ` &middot; <span class="tag warn">${r.qb_adjust > 0 ? esc(g.away) : esc(g.home)} regular QB out: ${signed(r.qb_adjust, 1)} pts to ${r.qb_adjust > 0 ? esc(g.home) : esc(g.away)}</span>` : "";
  return `<div class="note" style="margin-top:4px;">Power rankings: ${esc(g.home)} <strong>#${r.home_rank}</strong> vs ${esc(g.away)} <strong>#${r.away_rank}</strong> &rarr; rank spread <strong>${esc(spreadTxt)}</strong> (${signed(r.rank_gap, 1)} vs posted)${qb}</div>`;
}

function renderPower() {
  const pw = DATA.power, el = $("power-view");
  if (!pw || !pw.table || !pw.table.length) { el.innerHTML = `<div class="empty">Power rankings were not available this run.</div>`; return; }
  const bt = DATA.rating_backtest;
  const arrow = c => c == null || c === 0 ? `<span style="color:var(--text-faint)">&ndash;</span>` : c > 0 ? `<span class="up">&#9650;${c}</span>` : `<span class="down">&#9660;${-c}</span>`;
  el.innerHTML = `<div class="board"><h2>Power rankings, 1st to 32nd</h2>
    <div class="note">Each team's rating is fitted from every game it has played (recent games weigh more, last season fills in early on), solving all teams at once so beating a strong team counts for more: that is the strength-of-schedule adjustment. Refit every week. Points rule: the 15th team is neutral, the best team is 6 points better than the 15th (so #1 at #15 is -6, about ${(pw.per_rank).toFixed(2)} points per rank step); home field adds about ${pw.hfa} points.</div>
    <div class="scroll-x"><table class="ptbl"><thead><tr><th>#</th><th>Team</th><th>Chg</th><th>Rating</th><th>Record</th><th>Pts diff/g</th><th>Sched. strength</th><th>Off EPA</th><th>Def EPA</th></tr></thead><tbody>
    ${pw.table.map(r => `<tr><td class="num">${r.rank}</td><td><strong>${esc(r.team)}</strong></td><td>${arrow(r.change)}</td>
      <td class="num">${signed(r.rating, 1)}</td><td class="num">${r.record}</td><td class="num">${r.pd_per_game == null ? "&mdash;" : signed(r.pd_per_game, 1)}</td>
      <td class="num">${r.sos_rank ? "#" + r.sos_rank : "&mdash;"}</td><td class="num">${r.off_rank ? "#" + r.off_rank : "&mdash;"}</td><td class="num">${r.def_rank ? "#" + r.def_rank : "&mdash;"}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="note">Sched. strength: #1 = hardest schedule so far. Off/Def EPA: expected points per play, #1 = best offense / best defense.</div>
    ${bt ? `<div class="note"><strong>How well does it work?</strong> Walk-forward over ${bt.n.toLocaleString()} games (${esc(bt.seasons)}), each week predicted from earlier games only: the rank rule misses the final margin by ${bt.rank_rule_mae} points on average; the betting market misses by ${bt.market_mae}. Correlation of (rating minus market) with (result minus market) is ${bt.corr_edge_vs_miss}, i.e. the rankings carry no information the line doesn't already have. They are a clean way to compare teams and to sanity-check a spread, not a betting edge. Fitted slope: ${bt.fitted_points_per_rank} points per rank step. A missing regular QB moves a game ${bt.qb_change_points} points. Turnovers, rest, short weeks, roof, wind and surface were tested and did not help.</div>` : ""}
  </div>`;
}

/* ---------- wiring ---------- */
$("view-tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#view-tabs button").forEach(x => x.classList.toggle("active", x === b));
  const view = b.dataset.view;
  $("week-view").hidden = view !== "week";
  $("games-view").hidden = view !== "games";
  $("history-view").hidden = view !== "history";
  $("power-view").hidden = view !== "power";
  if (view === "games") renderGames();
  if (view === "power") renderPower();
  if (view === "history") { renderHistoryList(); renderHistoryDetail(); }
});
$("rows").addEventListener("click", e => {
  const b = e.target.closest(".hc [data-hc] button"); if (!b || b.disabled) return;
  e.stopPropagation();
  const key = b.parentElement.dataset.hc, v = b.dataset.v;
  HC[key] = key === "win" ? (v === "season" || v === "all" ? v : +v) : v;
  const p = P[S.open]; if (!p) return;
  const inp = $("wl-" + p.id), line = p.kind === "td" ? 0.5 : parseFloat(inp.value);
  renderHit(p, Number.isNaN(line) ? p.line : line);
}, true);
$("top-picks").addEventListener("click", e => {
  const b = e.target.closest("[data-open]"); if (b) openProp(+b.dataset.open);
});
$("hist-search").addEventListener("input", renderHistoryList);
$("hist-list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  HS.pid = b.dataset.pid; HS.market = null;
  renderHistoryList();
  renderHistoryDetail();
});

$("market-chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const m = b.dataset.m, on = !S.markets.has(m);
  on ? S.markets.add(m) : S.markets.delete(m);
  b.setAttribute("aria-pressed", on); S.limit = 80; renderList();
});
$("pos-seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#pos-seg button").forEach(x => x.classList.toggle("active", x === b));
  S.pos = b.dataset.pos; S.limit = 80; renderList();
});
$("rail-list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  railSelect(b.dataset.game || "", b.dataset.player || null);
});
$("player-chip").addEventListener("click", e => { if (e.target.closest("#clear-player")) railSelect(S.game, null); });
$("q").addEventListener("input", e => { S.q = e.target.value; S.limit = 80; renderRail(); renderList(); });
$("sort").addEventListener("change", e => { S.sort = e.target.value; renderList(); });
$("only-ev").addEventListener("change", e => { S.onlyEv = e.target.checked; S.limit = 80; renderList(); });
$("hide-thin").addEventListener("change", e => { S.hideThin = e.target.checked; S.limit = 80; renderList(); });
$("rows").addEventListener("click", e => {
  if (e.target.id === "more") { S.limit += 80; renderList(); return; }
  const head = e.target.closest(".row-head"); if (!head) return;
  const id = +head.parentElement.dataset.id; S.open = S.open === id ? null : id; renderList();
});
$("rows").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row-head")) { e.preventDefault(); e.target.click(); }
});

renderHeader(); renderTrackRecord(); renderTopPicks(); buildControls(); renderRail(); renderList();
</script>
